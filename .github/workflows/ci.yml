name: Agency OS CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agency_os
          POSTGRES_PASSWORD: agency_os_test_password
          POSTGRES_DB: agency_os_worker_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U agency_os -d agency_os_worker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DEV_AUTH_ENABLED: "true"
      MOCK_RUNTIME_ENABLED: "true"
      JWT_SECRET: ci-only-secret-not-used-outside-this-job-0123456789
      DATABASE_URL: sqlite:///./ci_agency_os.db
      AGENCY_OS_TEST_DATABASE_URL: postgresql+psycopg://agency_os:agency_os_test_password@localhost:5432/agency_os_worker_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Bootstrap isolated PostgreSQL test roles
        env:
          PGPASSWORD: agency_os_test_password
        run: psql -h localhost -U agency_os -d agency_os_worker_test -v ON_ERROR_STOP=1 -f docker/postgres/test-init.sql
      - name: Validate migration graph
        run: alembic heads
      - name: Apply migrations to disposable PostgreSQL test database
        env:
          DATABASE_URL: postgresql+psycopg://agency_os_migrator:local-only-test-migrator-password@localhost:5432/agency_os_worker_test
          MIGRATION_DATABASE_URL: postgresql+psycopg://agency_os_migrator:local-only-test-migrator-password@localhost:5432/agency_os_worker_test
        run: alembic upgrade head
      - name: Compile Python source
        run: python -m compileall -q app migrations tests
      - name: Run backend and PostgreSQL integration tests
        run: python -m pytest -q -rs
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
