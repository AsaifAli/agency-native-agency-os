services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agency_os
      POSTGRES_USER: agency_os
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Agency OS}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD in .env before starting Agency OS}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env before starting Agency OS}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:?Set POSTGRES_WORKER_PASSWORD in .env before starting Agency OS}
    ports:
      - "5432:5432"
    volumes:
      - agency_os_pg:/var/lib/postgresql/data
      - ./docker/postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency_os -d agency_os"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  migrate:
    build: .
    environment:
      APP_ENV: production
      PROCESS_ROLE: migration
      DATABASE_URL: postgresql+psycopg://agency_os_migrator:${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD in .env before starting Agency OS}@postgres:5432/agency_os
      MIGRATION_DATABASE_URL: postgresql+psycopg://agency_os_migrator:${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD in .env before starting Agency OS}@postgres:5432/agency_os
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.50
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    env_file: .env.runtime
    environment:
      PROCESS_ROLE: api
      DATABASE_URL: postgresql+psycopg://agency_os_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env before starting Agency OS}@postgres:5432/agency_os
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    build: .
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.00
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    env_file: .env.runtime
    environment:
      PROCESS_ROLE: worker
      DATABASE_URL: postgresql+psycopg://agency_os_worker:${POSTGRES_WORKER_PASSWORD:?Set POSTGRES_WORKER_PASSWORD in .env before starting Agency OS}@postgres:5432/agency_os
    command: ["python", "-m", "app.worker.main"]
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  agency_os_pg:
